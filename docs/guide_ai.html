<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>导盲机器人 · AI 语音助手</title>
<style>
:root {
  --bg: #0f0f14;
  --card: #1a1a24;
  --text: #e0e0e0;
  --sub: #888;
  --green: #00e676;
  --yellow: #ffd740;
  --orange: #ff9100;
  --red: #ff1744;
  --accent: #7c4dff;
  --border: #2a2a3a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* ---- 顶部状态栏 ---- */
#statusBar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--border);
}
#statusDot { width: 10px; height: 10px; border-radius: 50%; background: #666; margin-right: 8px; }
#statusDot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }
#statusDot.disconnected { background: var(--red); }
#statusText { font-size: 13px; color: var(--sub); }
#voiceToggle {
  background: none; border: 1px solid var(--border); color: var(--text);
  padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer;
}
#voiceToggle.on { background: var(--accent); border-color: var(--accent); }

/* ---- 主显示区 ---- */
#mainDisplay {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 20px;
  transition: background 0.5s;
}
#distanceNum { font-size: 7rem; font-weight: 900; line-height: 1; letter-spacing: -4px; }
#distanceUnit { font-size: 1.5rem; color: var(--sub); margin-top: 4px; }
#directionTag {
  font-size: 2rem; font-weight: 700; margin-top: 8px;
  padding: 6px 24px; border-radius: 30px;
}
#levelBar {
  width: 80%; max-width: 300px; height: 6px; border-radius: 3px;
  background: #333; margin-top: 20px; overflow: hidden;
}
#levelFill { height: 100%; border-radius: 3px; transition: width 0.3s, background 0.3s; }

/* ---- 底部面板 ---- */
#bottomPanel {
  background: var(--card); border-top: 1px solid var(--border);
  display: flex; flex-direction: column; max-height: 45%;
}
#chatArea { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.chatMsg { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.5; word-break: break-word; }
.chatMsg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.chatMsg.ai { align-self: flex-start; background: #2a2a38; border-bottom-left-radius: 4px; }
.chatMsg.system { align-self: center; background: transparent; color: var(--sub); font-size: 12px; }

#inputRow { display: flex; padding: 10px 12px; gap: 8px; border-top: 1px solid var(--border); }
#chatInput {
  flex: 1; background: #252530; border: 1px solid var(--border); border-radius: 24px;
  padding: 10px 18px; color: var(--text); font-size: 15px; outline: none;
}
#chatInput::placeholder { color: #555; }
#sendBtn, #micBtn {
  width: 44px; height: 44px; border-radius: 50%; border: none;
  font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
#sendBtn { background: var(--accent); color: #fff; }
#micBtn { background: #2a2a38; color: var(--text); }
#micBtn.listening { background: var(--red); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,23,68,0.4); } 50% { box-shadow: 0 0 0 14px rgba(255,23,68,0); } }

/* ---- 设置弹窗 ---- */
#settingsOverlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  align-items: center; justify-content: center; z-index: 100;
}
#settingsOverlay.show { display: flex; }
#settingsBox {
  background: var(--card); border-radius: 16px; padding: 20px; width: 90%; max-width: 360px;
}
#settingsBox h3 { margin-bottom: 12px; }
#settingsBox label { font-size: 13px; color: var(--sub); display: block; margin: 8px 0 4px; }
#settingsBox input, #settingsBox select {
  width: 100%; padding: 10px; background: #252530; border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 14px; margin-bottom: 8px;
}
#settingsBox button {
  width: 100%; padding: 12px; background: var(--accent); color: #fff;
  border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 8px;
}
</style>
</head>
<body>

<!-- 状态栏 -->
<div id="statusBar">
  <div style="display:flex;align-items:center;">
    <div id="statusDot"></div>
    <span id="statusText">等待连接...</span>
  </div>
  <div style="display:flex;gap:8px;">
    <button id="voiceToggle" class="on" onclick="toggleVoice()">🔊 语音开</button>
    <button id="settingsBtn" style="background:none;border:none;font-size:20px;cursor:pointer;" onclick="toggleSettings()">⚙️</button>
  </div>
</div>

<!-- 主显示 -->
<div id="mainDisplay">
  <div id="distanceNum">--</div>
  <div id="distanceUnit">厘米</div>
  <div id="directionTag"></div>
  <div id="levelBar"><div id="levelFill" style="width:0%"></div></div>
</div>

<!-- 底部对话面板 -->
<div id="bottomPanel">
  <div id="chatArea">
    <div class="chatMsg system">🤖 AI 语音助手已就绪<br>点击麦克风或输入文字开始对话</div>
  </div>
  <div id="inputRow">
    <button id="micBtn" onclick="startListening()">🎤</button>
    <input id="chatInput" type="text" placeholder="输入问题或点击麦克风..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- 设置弹窗 -->
<div id="settingsOverlay">
  <div id="settingsBox">
    <h3>⚙️ AI 设置</h3>
    <label>API 端点</label>
    <input id="apiEndpoint" value="https://api.deepseek.com/chat/completions">
    <label>API Key</label>
    <input id="apiKey" type="password" value="sk-0d60d5b6339d4bbaa149b59b97f64452">
    <label>模型</label>
    <select id="apiModel">
      <option value="deepseek-chat">DeepSeek V3</option>
      <option value="deepseek-reasoner">DeepSeek R1</option>
    </select>
    <label>语音语速</label>
    <input id="speechRate" type="range" min="0.5" max="1.5" step="0.1" value="0.95">
    <span style="font-size:12px;color:var(--sub);">当前: <span id="rateVal">0.95</span></span>
    <button onclick="saveSettings()">保存设置</button>
    <button style="background:#444;margin-top:4px;" onclick="toggleSettings()">取消</button>
  </div>
</div>

<script>
// ==================== 全局状态 ====================
const STATE = {
  ws: null,
  connected: false,
  voiceEnabled: true,
  audioReady: false,
  robotData: {
    distance: 0, direction: 'none', direction_cn: '',
    status: 'Clear', level: 'safe', level_cn: '安全',
    emergency: false, turning: false, turn_dir: '',
    angle: 90, x_pixel: 120, y_pixel: 0
  },
  lastObstacle: false,
  lastAnnounceTime: 0,
  announceInterval: 5000,
  safeAnnounced: true,
  listening: false,
  recognition: null,
};

const $ = id => document.getElementById(id);

// ==================== 浏览器能力检测 ====================
let chineseVoices = [];
let allVoices = [];
let ttsAvailable = false;
let sttAvailable = false;

function detectCapabilities() {
  if (window.speechSynthesis) {
    const loadVoices = () => {
      allVoices = speechSynthesis.getVoices();
      chineseVoices = allVoices.filter(
        v => v.lang.includes('zh') || v.lang.includes('cmn') || v.lang.includes('yue')
      );
      ttsAvailable = chineseVoices.length > 0;
      if (allVoices.length === 0) {
        addChat('system', '语音引擎未加载，1秒后重试...\n安卓: 设置→系统→语言→文字转语音→安装中文语音');
      } else if (ttsAvailable) {
        addChat('system', '中文语音: ' + chineseVoices.map(function(v){return v.name;}).join(', '));
      } else {
        addChat('system', '无中文语音！已有: ' + allVoices.slice(0,3).map(function(v){return v.name+'('+v.lang+')';}).join(', '));
      }
    };
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
    setTimeout(loadVoices, 1000);
    setTimeout(loadVoices, 3000);
  } else {
    addChat('system', '浏览器不支持语音合成，仅使用提示音');
  }

  sttAvailable = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  if (!sttAvailable) {
    $('micBtn').style.opacity = '0.4';
    addChat('system', '语音输入: 浏览器不支持');
  } else if (location.protocol === 'file:') {
    sttAvailable = false;
    $('micBtn').style.opacity = '0.4';
    addChat('system', '语音输入: file://不支持，请用 http://192.168.4.1/ 访问');
  }
}

// 首次用户交互时激活语音引擎
function initAudio() {
  if (STATE.audioReady) return;
  STATE.audioReady = true;
  if (window.speechSynthesis) {
    // 预加载：清空队列并说一个无声的词来激活
    try { speechSynthesis.cancel(); } catch(e) {}
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    try { speechSynthesis.speak(u); } catch(e) {}
  }
  // 首次检测（voices 可能已加载）
  if (chineseVoices.length === 0 && window.speechSynthesis) {
    chineseVoices = speechSynthesis.getVoices().filter(
      v => v.lang.includes('zh') || v.lang.includes('cmn')
    );
    ttsAvailable = chineseVoices.length > 0;
  }
}

// ==================== Web Audio 提示音 (所有浏览器通用) ====================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playBeep(freq, durationMs, pan) {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const panner = ctx.createStereoPanner();
    panner.pan.value = pan || 0;
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + durationMs / 1000);
    osc.connect(panner);
    panner.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + durationMs / 1000 + 0.05);
  } catch(e) {}
}

function playBeepPattern(freqL, freqR, beepMs, gapMs, count) {
  let delay = 0;
  for (let i = 0; i < count; i++) {
    let pan = 0, freq = 600;
    if (freqL > 0 && freqR > 0) {
      pan = 0; freq = freqL;  // 正前方：双声道中心播放
    } else if (freqL > 0) {
      pan = -0.6; freq = freqL;  // 左侧
    } else if (freqR > 0) {
      pan = 0.6; freq = freqR;  // 右侧
    }
    setTimeout(() => playBeep(freq, beepMs, pan), delay);
    delay += beepMs + gapMs;
  }
}

function beepAlert(direction, level) {
  let freqL = 0, freqR = 0, beepMs = 80, gapMs = 60, count = 2;
  switch(direction) {
    case 'left':  freqL = 800; freqR = 0; count = 3; break;
    case 'right': freqL = 0; freqR = 800; count = 3; break;
    case 'center': freqL = 600; freqR = 600; break;
  }
  if (level === 'danger') {
    freqL = freqR = 1000; beepMs = 50; gapMs = 50; count = 5;
  } else if (level === 'warning') {
    beepMs = 70; gapMs = 50; count = 3;
  }
  playBeepPattern(freqL, freqR, beepMs, gapMs, count);
}

// ==================== WebSocket ====================
function connectWS() {
  if (STATE.ws) { STATE.ws.close(); STATE.ws = null; }
  const url = 'ws://192.168.4.1/ws';
  STATE.ws = new WebSocket(url);

  STATE.ws.onopen = () => {
    STATE.connected = true;
    $('statusDot').className = 'connected';
    $('statusText').textContent = '已连接';
    addChat('system', '✅ 已连接到机器人');
    $('distanceNum').textContent = '等待数据...';
  };

  STATE.ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      STATE.robotData = { ...STATE.robotData, ...data };
      updateDisplay();
      checkAnnounce();
    } catch(ex) {}
  };

  STATE.ws.onclose = () => {
    STATE.connected = false;
    $('statusDot').className = 'disconnected';
    $('statusText').textContent = '断开，5秒后重连...';
    setTimeout(connectWS, 5000);
  };

  STATE.ws.onerror = () => {
    STATE.connected = false;
    $('statusDot').className = 'disconnected';
    $('statusText').textContent = '无法连接，请确认已连上WiFi: MyRobot';
    addChat('system', '⚠️ 无法连接机器人，请确认：\n1. 手机已连接 WiFi "MyRobot"\n2. 机器人已开机');
  };
}

// ==================== 显示更新 ====================
function updateDisplay() {
  const d = STATE.robotData;
  const hasObs = d.status === 'Obstacle';

  $('distanceNum').textContent = d.distance > 0 ? d.distance.toFixed(1) : '--';

  if (hasObs && d.direction_cn) {
    $('directionTag').textContent = d.direction_cn;
    $('directionTag').style.display = 'block';
  } else {
    $('directionTag').style.display = 'none';
  }

  // 颜色主题
  let bg, fillColor, fillPct;
  switch(d.level) {
    case 'danger':  bg = '#1a0000'; fillColor = 'var(--red)';    fillPct = 100; break;
    case 'warning': bg = '#1a0f00'; fillColor = 'var(--orange)'; fillPct = 65;  break;
    case 'caution': bg = '#1a1a00'; fillColor = 'var(--yellow)'; fillPct = 35;  break;
    default:        bg = '#0a1a0a'; fillColor = 'var(--green)';  fillPct = 10;  break;
  }
  $('mainDisplay').style.background = bg;
  $('levelFill').style.width = fillPct + '%';
  $('levelFill').style.background = fillColor;
  $('distanceNum').style.color = hasObs ? fillColor : 'var(--text)';
}

// ==================== 语音播报 ====================
function speak(text, rate) {
  if (!STATE.voiceEnabled) return;
  const ss = window.speechSynthesis;
  if (!ss || !ttsAvailable) {
    // 降级到提示音：提取方向和等级信息
    const d = STATE.robotData;
    beepAlert(d.direction, d.level);
    return;
  }
  try { ss.cancel(); } catch(e) {}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = rate || parseFloat($('speechRate').value);
  u.pitch = 1.0;
  u.volume = 1.0;
  // 优先使用中文语音
  if (chineseVoices.length > 0) {
    // 优选：普通话 > 中国大陆 > 台湾 > 香港
    const pref = chineseVoices.find(v => v.name.includes('Tingting') || v.name.includes('Yaoyao'))  // QQ浏览器/Chrome 常见中文语音
              || chineseVoices.find(v => v.lang === 'zh-CN')
              || chineseVoices[0];
    if (pref) u.voice = pref;
  }
  ss.speak(u);
}

function speakAlert() {
  const d = STATE.robotData;
  const dist = Math.round(d.distance);
  const distM = (dist / 100).toFixed(1);

  let msg;
  if (dist < 100) {
    msg = `${d.direction_cn}${dist}厘米处有障碍物`;
  } else {
    msg = `${d.direction_cn}${distM}米处有障碍物`;
  }
  if (d.level === 'danger') msg = '小心！' + msg;
  else if (d.level === 'warning') msg = '注意，' + msg;

  const rate = d.level === 'danger' ? 1.1 : d.level === 'warning' ? 1.0 : 0.9;

  // 先用蜂鸣提醒注意，再用语音播报具体信息
  beepAlert(d.direction, d.level);
  setTimeout(() => speak(msg, rate), 400);
}

function checkAnnounce() {
  const d = STATE.robotData;
  const hasObs = d.status === 'Obstacle';
  const now = Date.now();

  // 紧急转向提示
  if (d.emergency && d.turning) {
    if (now - STATE.lastAnnounceTime > 1500) {
      STATE.lastAnnounceTime = now;
      const dirCN = d.turn_dir === 'left' ? '左转' : '右转';
      playBeepPattern(1000, 1000, 80, 60, 3);
      setTimeout(() => speak(`危险！紧急避障，准备${dirCN}`, 1.1), 400);
    }
    STATE.lastObstacle = true;
    STATE.safeAnnounced = false;
    return;
  }

  // 无障碍 → 播报一次"安全"
  if (!hasObs) {
    if (STATE.lastObstacle && !STATE.safeAnnounced && now - STATE.lastAnnounceTime > 3000) {
      STATE.lastAnnounceTime = now;
      STATE.safeAnnounced = true;
      playBeep(440, 150, 0);
      setTimeout(() => speak('前方已安全，可以继续前进', 0.9), 200);
    }
    STATE.lastObstacle = false;
    return;
  }

  // 有障碍 → 定时播报
  STATE.lastObstacle = true;
  STATE.safeAnnounced = false;

  let interval;
  switch(d.level) {
    case 'danger':  interval = 2000; break;
    case 'warning': interval = 3500; break;
    case 'caution': interval = 5500; break;
    default:        interval = 5000; break;
  }

  if (now - STATE.lastAnnounceTime < interval) return;
  STATE.lastAnnounceTime = now;

  speakAlert();
}

function toggleVoice() {
  STATE.voiceEnabled = !STATE.voiceEnabled;
  const btn = $('voiceToggle');
  if (STATE.voiceEnabled) {
    initAudio();
    btn.className = 'on'; btn.textContent = '🔊 语音开';
  } else {
    btn.className = ''; btn.textContent = '🔇 语音关';
    if (window.speechSynthesis) {
      try { window.speechSynthesis.cancel(); } catch(e) {}
    }
  }
}

// ==================== AI 对话 ====================
function buildSystemPrompt() {
  const d = STATE.robotData;
  const hasObs = d.status === 'Obstacle';
  let ctx = '你是一个导盲机器人语音助手，帮助视障人士安全出行。\n当前环境数据：\n';
  if (hasObs) {
    ctx += `- 障碍物距离: ${Math.round(d.distance)}厘米 (约${(d.distance/100).toFixed(1)}米)\n`;
    ctx += `- 障碍物方向: ${d.direction_cn}\n`;
    ctx += `- 安全等级: ${d.level_cn}\n`;
  } else {
    ctx += '- 前方无障碍物，状态安全\n';
  }
  ctx += `- 紧急避障: ${d.emergency ? '是（正在' + (d.turn_dir==='left'?'左转':'右转') + '）' : '否'}\n`;
  ctx += '\n要求：用简洁温暖的中文回答，直接给出有用信息。用户是视障人士，回答要具体、有方向感。回复控制在2-3句话。';
  return ctx;
}

async function sendMessage(text) {
  initAudio();
  const input = $('chatInput');
  const question = text || input.value.trim();
  if (!question) return;
  input.value = '';

  addChat('user', question);

  const apiKey = $('apiKey').value.trim();
  if (!apiKey) {
    addChat('ai', '请先在设置中填入 AI API Key（点击右上角 ⚙️）');
    return;
  }

  addChat('system', '🤔 AI 思考中...');
  scrollChat();

  try {
    const resp = await fetch($('apiEndpoint').value, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`,
      },
      body: JSON.stringify({
        model: $('apiModel').value,
        messages: [
          { role: 'system', content: buildSystemPrompt() },
          { role: 'user', content: question },
        ],
        max_tokens: 300,
        temperature: 0.7,
      }),
    });

    const data = await resp.json();
    // 移除 "思考中"
    const msgs = $('chatArea').querySelectorAll('.chatMsg.system');
    if (msgs.length) msgs[msgs.length - 1].remove();

    if (data.choices && data.choices[0]) {
      const reply = data.choices[0].message.content;
      addChat('ai', reply);
      if (STATE.voiceEnabled) speak(reply, 1.0);
    } else if (data.error) {
      addChat('ai', `API 错误: ${data.error.message}`);
    } else {
      addChat('ai', 'AI 返回异常，请检查 API 设置');
    }
  } catch(err) {
    const msgs = $('chatArea').querySelectorAll('.chatMsg.system');
    if (msgs.length) msgs[msgs.length - 1].remove();
    addChat('ai', `网络错误: ${err.message}\n请检查手机是否已连接移动数据`);
  }
  scrollChat();
}

function addChat(role, text) {
  const div = document.createElement('div');
  div.className = `chatMsg ${role}`;
  div.textContent = text;
  $('chatArea').appendChild(div);
  scrollChat();
}

function scrollChat() {
  const area = $('chatArea');
  setTimeout(() => { area.scrollTop = area.scrollHeight; }, 50);
}

// ==================== 语音识别 ====================
function startListening() {
  initAudio();
  if (STATE.listening) {
    STATE.recognition.stop();
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    addChat('system', '⚠️ 此浏览器不支持语音识别。\n请使用 Chrome 浏览器，并确保已授予麦克风权限。');
    return;
  }

  STATE.recognition = new SpeechRecognition();
  STATE.recognition.lang = 'zh-CN';
  STATE.recognition.interimResults = false;
  STATE.recognition.maxAlternatives = 1;
  STATE.recognition.continuous = false;

  STATE.listening = true;
  $('micBtn').classList.add('listening');
  $('micBtn').textContent = '🔴';
  addChat('system', '🎤 正在聆听...（首次使用需允许麦克风权限）');

  STATE.recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    const msgs = $('chatArea').querySelectorAll('.chatMsg.system');
    for (const m of msgs) {
      if (m.textContent.includes('聆听')) m.remove();
    }
    $('chatInput').value = transcript;
    sendMessage(transcript);
  };

  STATE.recognition.onerror = (event) => {
    STATE.listening = false;
    $('micBtn').classList.remove('listening');
    $('micBtn').textContent = '🎤';
    const msgs = $('chatArea').querySelectorAll('.chatMsg.system');
    for (const m of msgs) {
      if (m.textContent.includes('聆听') || m.textContent.includes('权限')) m.remove();
    }
    if (event.error === 'not-allowed') {
      addChat('system', '⚠️ 麦克风权限被拒绝。请在浏览器设置中允许麦克风访问。\nChrome: 设置 → 隐私与安全 → 网站设置 → 麦克风');
    } else if (event.error === 'no-speech') {
      addChat('system', '未检测到语音，请再试一次');
    } else if (event.error !== 'aborted') {
      addChat('system', `语音识别失败: ${event.error}`);
    }
  };

  STATE.recognition.onend = () => {
    STATE.listening = false;
    $('micBtn').classList.remove('listening');
    $('micBtn').textContent = '🎤';
  };

  STATE.recognition.start();
}

// ==================== 设置 ====================
function toggleSettings() {
  const overlay = $('settingsOverlay');
  overlay.classList.toggle('show');
  if (overlay.classList.contains('show')) {
    $('speechRate').dispatchEvent(new Event('input'));
  }
}

function saveSettings() {
  toggleSettings();
  addChat('system', '✅ 设置已保存');
}

$('speechRate').addEventListener('input', function() {
  $('rateVal').textContent = this.value;
});

// ==================== 输入事件 ====================
$('chatInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
});

// ==================== 启动 ====================
window.onload = () => {
  detectCapabilities();
  connectWS();
  updateDisplay();
};
</script>
</body>
</html>
